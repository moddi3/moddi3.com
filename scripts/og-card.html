<!doctype html>
<!-- OG card source. Not deployed; rendered to public/og-image.png via headless Chrome. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "Space Grotesk";
        font-style: normal;
        font-weight: 300 700;
        font-display: swap;
        src: url("../public/fonts/space-grotesk-latin.woff2") format("woff2");
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 1200px;
        height: 630px;
        margin: 0;
        padding: 96px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: #151815;
        color: #edf0e6;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .site {
        margin: 0 0 32px;
        color: #89917f;
        font-size: 32px;
        letter-spacing: 0.04em;
      }

      h1 {
        margin: 0 0 24px;
        font-family: "Space Grotesk", -apple-system, "Segoe UI", sans-serif;
        font-size: 148px;
        font-weight: 500;
        line-height: 0.98;
        letter-spacing: -0.03em;
      }

      .rule {
        width: 96px;
        height: 8px;
        margin-bottom: 32px;
        background: #9fbf8e;
      }

      p {
        margin: 0;
        color: #c0c6b4;
        font-size: 40px;
        line-height: 1.4;
        letter-spacing: -0.012em;
      }
    </style>
  </head>
  <body>
    <p class="site">moddi3.com</p>
    <h1>Vlad Ivanov</h1>
    <div class="rule"></div>
